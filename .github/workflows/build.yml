name: Build Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore LocalCrypto.csproj

      - name: Build (Release)
        run: dotnet build LocalCrypto.csproj --no-restore -c Release

      - name: Publish Windows x64
        run: dotnet publish LocalCrypto.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalCrypto-win-x64
          path: ./publish
